<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNN Visualizer · Cat vs Dog</title>
  <meta name="description" content="Interactive 3D visualization of a convolutional neural network classifying cat vs dog images.">
  <script type="module" crossorigin src="/assets/index-BxRvtcn6.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BXeNcVC6.css">
</head>
<body>
  <canvas id="three"></canvas>

  <!-- Brand -->
  <div class="brand">
    <div class="title">CNN Visualizer</div>
    <div class="sub">Cat vs Dog classification · 64×64 input</div>
  </div>

  <!-- Status -->
  <div class="status">
    <span class="dot"></span>
    <span class="layer-name" id="status-text">Idle, awaiting inference</span>
    <span class="sep">·</span>
    <span id="status-meta">drag to orbit</span>
    <span class="spacer"></span>
    <span class="hint">drag <kbd>LMB</kbd> orbit · <kbd>RMB</kbd> pan · <kbd>scroll</kbd> zoom</span>
  </div>

  <!-- Projected layer labels + vector overlay -->
  <div class="layer-labels" id="layer-labels"></div>
  <div class="vec" id="vec-overlay"></div>

  <!-- Panel toggle -->
  <button class="panel-toggle" id="panel-toggle" aria-label="Show inference panel" title="Show inference panel">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="7" x2="13" y2="7"></line>
      <line x1="17" y1="7" x2="20" y2="7"></line>
      <circle cx="15" cy="7" r="2"></circle>
      <line x1="4" y1="12" x2="7" y2="12"></line>
      <line x1="11" y1="12" x2="20" y2="12"></line>
      <circle cx="9" cy="12" r="2"></circle>
      <line x1="4" y1="17" x2="14" y2="17"></line>
      <line x1="18" y1="17" x2="20" y2="17"></line>
      <circle cx="16" cy="17" r="2"></circle>
    </svg>
  </button>

  <!-- Inference Panel -->
  <aside class="panel" id="panel">
    <h2>
      <span>Inference</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="pill">live</span>
        <button class="panel-close" id="panel-close" aria-label="Hide panel" title="Hide panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </span>
    </h2>

    <div class="group">
      <div class="label"><span>Input image</span><b id="lbl-input">Cat · 01</b></div>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="group">
      <div class="label"><span>Dataset size</span><b><span id="lbl-samples">2,000</span> samples</b></div>
      <div class="slider-wrap">
        <input type="range" id="dataset" min="0" max="100" step="1" value="46">
      </div>
    </div>

    <div class="group">
      <div class="label"><span>Model accuracy</span><span id="lbl-jitter" style="color:var(--on-surface-3)">±2.0%</span></div>
      <div class="acc-block">
        <span class="val" id="acc-val">82.4</span>
        <span class="pct">%</span>
        <span class="delta" id="acc-delta">baseline</span>
      </div>
      <canvas id="chart"></canvas>
    </div>

    <button class="btn" id="classify">Classify<span class="arrow">→</span></button>

    <div class="pred" id="pred">
      <div class="row cat"><span class="name">Cat</span><div class="bar"><div class="fill" id="bar-cat"></div></div><span class="pct" id="pct-cat">0%</span></div>
      <div class="row dog"><span class="name">Dog</span><div class="bar"><div class="fill" id="bar-dog"></div></div><span class="pct" id="pct-dog">0%</span></div>
      <div class="winner">Prediction · <b id="winner">—</b></div>
    </div>
  </aside>

</body>
</html>
